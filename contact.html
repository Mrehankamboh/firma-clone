    <a class="logo" href="index.html">FIRMA</a>
    <button class="burger" type="button" aria-label="Open menu"><i></i><i></i></button>
    <nav class="side">

  <main class="page-main">
    <p class="kicker">Work with us</p>
    <h1>Got an idea?</h1>
<p>Send a message and we’ll take it from there. We work best through open, honest collaboration.</p>
<p><a href="mailto:hello@firma.com">hello@firma.com</a><br>+44 20 7946 0872<br>91 Brick Lane, London E1 6QL</p>
<form class="stack" onsubmit="event.preventDefault(); this.innerHTML='<p>Message received. We’ll write back.</p>'">
  <input class="field" name="name" placeholder="Your name" required />
  <input class="field" type="email" name="email" placeholder="Email" required />
  <input class="field" name="note" placeholder="What’s the project?" required />
  <button class="dotlink" type="submit">Send Message</button>
</form>
  </main>
  <script>
    const menu = document.querySelector(".menu");
    document.querySelector(".burger").onclick = () => menu.classList.add("open");
    document.querySelector(".x").onclick = () => menu.classList.remove("open");
  </script>
